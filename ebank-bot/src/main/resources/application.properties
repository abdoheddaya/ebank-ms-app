spring.application.name=ebank-bot
server.port=8060
server.address=127.0.0.1
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.customers.url=http://127.0.0.1:8056
spring.ai.mcp.client.streamable-http.connections.accounts.url=http://127.0.0.1:8057
app.telegram.enabled=${TELEGRAM_BOT_ENABLED:false}
app.telegram.token=${TELEGRAM_BOT_TOKEN:}
app.telegram.allowed-chat-id=${TELEGRAM_ALLOWED_CHAT_ID:0}
app.discord.enabled=${DISCORD_BOT_ENABLED:false}
app.discord.token=${DISCORD_BOT_TOKEN:}
app.discord.allowed-user-id=${DISCORD_ALLOWED_USER_ID:0}
