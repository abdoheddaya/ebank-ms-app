spring.application.name=ebank-service
server.port=8057
server.address=127.0.0.1

spring.datasource.url=jdbc:h2:mem:accounts-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.cloud.config.enabled=false
eureka.client.enabled=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=ebank-service-mcp
